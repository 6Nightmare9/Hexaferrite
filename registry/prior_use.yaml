# Prior-use disclosure for laboratory Observations (stage 1b).
# prior_use_status: used_prior | unknown_prior_use | no_prior_use_found.
# validation_mode: retrospective | independent_candidate. independent_candidate is allowed ONLY with
# no_prior_use_found AND a user_confirmation record; everything else is retrospective.
# 2026-10-25 (user message): the Moessbauer measurements SMP-009..013 / OBS-MOS-001..005 were used in developing the
# previous model -> used_prior / retrospective. Together with the XRD observations (prior analyses) EVERY laboratory
# Observation is now retrospective; see independent_lab_validation_available.
# This status is copied into every ValidationResult (hexw.registry.prior_use.apply_prior_use).
# Evidence: file names and identifier columns. CSV files of prior analyses were read IN FULL into memory
# when the identifier column was extracted; only that column of identifiers was output or used (no numbers
# from them were recorded, shown or used). Other prior-analysis files (images, docx, .mtd) were not opened.
